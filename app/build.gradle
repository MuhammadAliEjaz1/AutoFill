plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autofiller.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.autofiller.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // A fixed signing key, so every new build installs over the old one
    // (no need to uninstall first). The key file is app/autofiller.jks
    signingConfigs {
        debug {
            storeFile file('autofiller.jks')
            storePassword 'autofiller'
            keyAlias 'autofiller'
            keyPassword 'autofiller'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
